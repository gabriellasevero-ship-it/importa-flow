name: Backup para repositório espelho

on:
  push:
    branches: [main]
  schedule:
    # Diário às 06:00 UTC (03:00 horário de Brasília)
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-backup
  cancel-in-progress: false

env:
  BACKUP_REPO_URL: https://github.com/gabriellasevero-ship-it/importa-flow-backup

jobs:
  mirror-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout com histórico completo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validar configuração do backup
        env:
          BACKUP_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
        run: |
          if [ -z "$BACKUP_TOKEN" ]; then
            echo "::error::Secret BACKUP_REPO_TOKEN não configurado em importa-flow → Settings → Secrets and variables → Actions → Secrets."
            exit 1
          fi

      - name: Espelhar branches e tags no repositório de backup
        env:
          BACKUP_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
          BACKUP_REPO: ${{ env.BACKUP_REPO_URL }}
          GITHUB_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          REPO_PATH="${BACKUP_REPO#https://github.com/}"
          REPO_PATH="${REPO_PATH#http://github.com/}"
          REPO_PATH="${REPO_PATH%.git}"

          # Fine-grained PAT: usuário GitHub + token como senha
          BACKUP_URL="https://${GITHUB_OWNER}:${BACKUP_TOKEN}@github.com/${REPO_PATH}.git"

          echo "Testando acesso ao repositório de backup (${REPO_PATH})..."
          if ! git ls-remote "$BACKUP_URL" HEAD; then
            echo "::error::Não foi possível acessar importa-flow-backup."
            echo "::error::Confira: (1) o repo existe e é privado, (2) o token tem Contents Read and write no importa-flow-backup, (3) o secret BACKUP_REPO_TOKEN foi colado sem espaços extras."
            exit 128
          fi

          git remote add backup "$BACKUP_URL"

          echo "Enviando branches..."
          git push backup --all --force

          echo "Enviando tags..."
          git push backup --tags --force

          echo "Backup concluído com sucesso."
